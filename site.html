<!doctype html>
<html lang="zh-CN" data-page="site">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script type="module" crossorigin src="/assets/site-BA5yE_bK.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/site-header-DOtGGqD5.js">
    <link rel="modulepreload" crossorigin href="/assets/arrow-up-right-Dww9Jzh-.js">
    <link rel="modulepreload" crossorigin href="/assets/page-shell-C_REX07j.js">
    <link rel="stylesheet" crossorigin href="/assets/site-header-D-iWB_xC.css">
    <title>网站信息 - 绍兴理工学院网络安全社</title>
    <meta name="description" content="绍兴理工学院网络安全社官网用到的技术栈，以及维护它的人。" />
  </head>
  <body>
    <div id="root"></div>
    <script>



      (function () {
        try {
          var storedTheme = localStorage.getItem("sit-ctf-theme");
          var dark =
            storedTheme === "dark" ||
            (!storedTheme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";



          var storedMotion = localStorage.getItem("sit-ctf-motion");
          var motion =
            storedMotion === "on" ||
            (storedMotion === null &&
              !window.matchMedia("(max-width: 639px)").matches &&
              !window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          document.documentElement.dataset.motion = motion ? "on" : "off";


          if (localStorage.getItem("sit-ctf-locale") === "en") {
            document.documentElement.lang = "en";
          }
        } catch (e) {
          document.documentElement.dataset.motion = "on";
        }
      })();
    </script>
  </body>
</html>
